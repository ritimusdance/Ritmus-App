<style>
/* Layout: sidebar fixa à esquerda (logo, perfil, menu) + área de trabalho em vidro sobre fundo obsidiana */
:root{
  --bg:#09090b; --bg-2:#101014;
  --glass:rgba(255,255,255,.04); --glass-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  --fg:#f5f5f7; --fg-2:#a8a8b3; --fg-3:#74747f;
  --pink:#C74375; --coral:#F08A75; --cool:#6fb7d8;
  --grad:linear-gradient(135deg,#C74375 0%,#F08A75 100%);
  --ok:#4ade9a; --warn:#fbbf24; --bad:#fb7185; --sheet:#FBBF24;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Figtree","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(520px 420px at 8% -6%,rgba(199,67,117,.20),transparent 70%),
 radial-gradient(520px 420px at 100% 108%,rgba(240,138,117,.14),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h2{font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;font-weight:600}
.mono,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.sm{font-size:12px}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{position:relative;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:20px;border-right:1px solid var(--line);background:rgba(9,9,11,.6);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:4px 0 2px}
.brand img{width:64px;height:auto;display:block}
.brand b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--fg-3)}
.who{font-size:12px;color:var(--fg-2);text-align:center}
.who strong{color:var(--fg);font-weight:500}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;color:var(--fg-2);padding:6px 12px;border-radius:999px;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--fg)}
.seg button.on{background:#f5f5f7;color:#09090b;font-weight:500}
.side .seg{display:flex}.side .seg button{flex:1;justify-content:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--fg-2);padding:9px 12px;border-radius:12px;text-align:left;font-size:14px}
.nav button:hover{background:var(--glass-2);color:var(--fg)}
.nav button.on{background:var(--grad);color:#fff;font-weight:500;box-shadow:0 6px 20px -8px rgba(199,67,117,.7)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

.main{padding:28px clamp(16px,3vw,36px) 48px;min-width:0;position:relative}
.stack{display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 16px;flex-wrap:wrap}
.head p{color:var(--fg-2);margin-top:2px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);min-width:0}
.glass.flush{padding:0;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.wd{position:relative;display:flex;min-width:0}.wd>.glass,.wd>.kpi{flex:1;min-width:0}
.s-sm{grid-column:span 3}.s-md{grid-column:span 6}.s-lg{grid-column:span 12}
@media (max-width:1180px){.s-sm{grid-column:span 6}.s-md{grid-column:span 12}}
@media (max-width:560px){.s-sm{grid-column:span 12}}
.editing .wd{padding-top:42px}
.wctl{position:absolute;top:6px;right:8px;z-index:3;display:flex;gap:2px;padding:2px;border-radius:12px;background:rgba(9,9,11,.85);border:1px solid var(--line-2);backdrop-filter:blur(10px)}
.editing .wd{cursor:grab;outline:1px dashed var(--line-2);outline-offset:4px;border-radius:22px}
.editing .wd.dragover{outline-color:var(--coral);outline-style:solid}
.qfab{position:fixed;right:20px;bottom:20px;z-index:62;box-shadow:0 14px 34px -8px rgba(199,67,117,.7);border-radius:999px;padding:12px 20px}
.quick{position:fixed;right:20px;bottom:78px;z-index:62;width:min(340px,calc(100vw - 32px));max-height:calc(100vh - 110px);overflow-y:auto;background:#101014;border:1px solid var(--line-2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
textarea{resize:vertical}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpi{padding:16px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--fg-2);display:flex;gap:7px;align-items:center}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--fg-3)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass-2);font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{border-color:transparent;background:var(--grad);color:#fff;box-shadow:0 8px 24px -10px rgba(199,67,117,.8)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:10px}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--fg-2)}
.ib:hover{background:var(--glass-2);color:var(--fg)}
.ib.del:hover{color:var(--bad)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--fg-3);font-size:12px;padding:0 12px 10px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
th.c,td.c{text-align:center} th.r,td.r{text-align:right}
tbody tr:hover td{background:rgba(255,255,255,.02)}
td.name{display:flex;align-items:center;gap:10px;font-weight:500}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line);color:var(--coral);font-size:12px;font-weight:600;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--glass);white-space:nowrap}
.pill.ok{color:var(--ok);background:rgba(74,222,154,.10);border-color:rgba(74,222,154,.28)}
.pill.warn{color:var(--warn);background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.28)}
.pill.bad{color:var(--bad);background:rgba(251,113,133,.10);border-color:rgba(251,113,133,.28)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.empty{padding:34px 12px;text-align:center;color:var(--fg-3)}

label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--fg-2);min-width:0}
input,select,textarea{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:8px 11px;min-width:0;width:100%;color:var(--fg)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--coral)}
select option{background:#18181c;color:var(--fg)}
input[type=checkbox]{width:auto;accent-color:var(--pink)}
input[type=date]{color-scheme:dark;width:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sizes label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--fg-3);text-align:center}
.sizes input{text-align:center;padding:6px 4px}
.per{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dates{display:flex;gap:8px;align-items:center;color:var(--fg-3);font-size:12.5px}

.vl{fill:var(--fg-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:rgba(255,255,255,.08);stroke-width:1}
.chart .ax{fill:var(--fg-3);font-size:11px;font-family:var(--font)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{display:flex;flex-direction:column;gap:10px}
.hb div.r{display:grid;grid-template-columns:minmax(70px,120px) minmax(0,1fr) 38px;gap:10px;align-items:center;font-size:13px}
.hb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.prod{display:flex;flex-direction:column;gap:12px}
.et{display:grid;grid-template-columns:minmax(0,1fr) 76px 24px 32px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.et input{padding:5px 8px;text-align:center;font-variant-numeric:tabular-nums}
.add-et{display:grid;grid-template-columns:minmax(0,1fr) 76px auto;gap:8px}

/* grade do gerente */
.sheet-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.grade{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
.grade th,.grade td{border:0;border-bottom:1px solid var(--line);padding:0;text-align:center}
.grade thead tr:first-child th{background:var(--sheet);color:#1d1600;font-weight:600;padding:8px 6px;min-width:50px}
.grade .st{position:sticky;left:0;z-index:2;text-align:left;padding:8px 12px;min-width:120px;background:#14141a;color:var(--fg);font-weight:500}
.grade thead .st{background:var(--sheet);color:#1d1600}
.grade .qrow td{background:rgba(255,255,255,.04)}
.qcell{position:relative;display:block;width:100%;border:0;background:transparent;padding:9px 6px;font-variant-numeric:tabular-nums;font-weight:500}
.qcell:hover{background:rgba(255,255,255,.1)}
.qcell.lost::after{content:"";position:absolute;top:0;right:0;border-top:11px solid #ef4444;border-left:11px solid transparent}
.ck{width:34px;height:30px;margin:5px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:transparent;font-size:11px;font-weight:600;transition:background .15s,border-color .15s}
.ck:hover{border-color:var(--line-2)}
.ck.on{background:rgba(74,222,154,.18);border-color:rgba(74,222,154,.55);color:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--fg-2)}
.chip.on{border-color:rgba(240,138,117,.6);color:var(--fg);background:rgba(240,138,117,.12)}
.bulk{position:sticky;bottom:14px;z-index:5;display:flex;justify-content:center;pointer-events:none}
.bulk .btn{pointer-events:auto;padding:13px 26px;font-size:14.5px;border-radius:16px}
.note{position:fixed;z-index:60;width:272px;background:#fff6bf;color:#33290a;border-radius:6px;padding:12px;box-shadow:0 18px 40px -10px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:8px}
.note label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:600;color:#6b5a14}
.note input,.note select{background:#fffdf0;border:1px solid #d9c870;color:#33290a;border-radius:4px;padding:5px 7px}
.note b{font-size:12px;letter-spacing:.06em}
.note .btn{background:#33290a;color:#fff6bf;border:0;padding:6px 12px;border-radius:6px}
.note .btn.g{background:transparent;color:#33290a}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.sheetm{position:relative;width:min(520px,100%);max-height:92vh;overflow-y:auto;background:#101014;border:1px solid var(--line-2);border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
.sheetm.wide{width:min(720px,100%)}
.sheetm header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheetm .body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sheetm footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:70;background:rgba(30,30,36,.92);backdrop-filter:blur(20px);border:1px solid var(--line-2);padding:10px 18px;border-radius:14px;font-size:13.5px;max-width:calc(100vw - 32px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

.login{position:relative;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .box{width:min(420px,100%);display:flex;flex-direction:column;gap:22px;align-items:stretch}
.login .brand img{width:84px}
.role{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-align:left}
.role:hover{border-color:rgba(240,138,117,.5);background:var(--glass-2)}
.role .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line);color:var(--coral)}
.role b{display:block;font-weight:500}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px 16px;align-items:center;text-align:center}
.vs .m{color:var(--fg-3);font-size:12.5px}
.vs .win{color:var(--ok);font-weight:600}
.vs .big{font-size:22px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;align-items:flex-end;height:22px}
.dots i{width:6px;background:var(--grad);border-radius:2px;opacity:.9;min-height:2px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:relative;height:auto;flex-direction:column;gap:12px;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{flex-direction:row;justify-content:flex-start;text-align:left;gap:12px}
  .brand img{width:42px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  .nav button{white-space:nowrap;padding:8px 12px}
  .side .foot{margin-top:0;flex-direction:row;align-items:center;justify-content:space-between}
  .who{text-align:left}
  .main{padding-top:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seed(){
  const rnd=mulberry(11);
  const S={cfg:{dN:'Bruno',dS:'1234',gN:'Gênia',gS:'1234'},funcs:[],produtos:[],etapas:[],os:[],aps:[],perdas:[],avisos:[],faltas:[],dash:null,nid:1};
  const id=()=>S.nid++;
  const pids={};
  ['Korino','Ovinho','Máxima','Premium'].forEach(n=>{
    const pid=id();pids[n]=pid;S.produtos.push({id:pid,nome:n});
    [['Fechamento',1],['Tezinho',1.2],['Elástico',.8],['Fita',.8],['Acabamento',1.5]].forEach(([nm,p],i)=>S.etapas.push({id:id(),pid,nome:nm,ordem:i+1,pontos:p}));
  });
  [['Andréia','Costura',60],['Camila','Mesa',55],['Luiza','Cola',55],['Marcos','Fita',50]].forEach(([nome,setor,meta])=>S.funcs.push({id:id(),nome,setor,meta,ativo:true}));
  const mk=(codigo,cliente,cor,pedido,prod,grade)=>S.os.push({id:id(),codigo,cliente,cor,pedido,pid:pids[prod],grade,status:'Em andamento'});
  mk('KR001','Escola Ballet Duarte','Rosa',1,'Korino',{28:12,29:16,30:20,31:20,32:16,33:12,34:8});
  mk('OV002','Studio Pirueta','Verde',2,'Ovinho',{30:10,31:14,32:18,33:18,34:14,35:10,36:8,37:6});
  mk('MX003','Academia Spaccato','Azul',3,'Máxima',{32:20,33:26,34:30,35:30,36:26,37:20,38:14,39:10});
  const pool=S.os.map(o=>{const es=S.etapas.filter(e=>e.pid===o.pid);const arr=[];es.forEach(e=>Object.keys(o.grade).forEach(n=>arr.push({oid:o.id,eid:e.id,n:+n})));
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr});
  const quota=[3,3,2,2];const t=today();
  for(let d=-6;d<=0;d++){
    const day=addDays(t,d);
    S.funcs.forEach((f,fi)=>{
      let q=d===0?[3,2,1,0][fi]:Math.max(1,Math.round(quota[fi]*(.7+rnd()*.8)));
      const groups={};
      while(q-->0){
        let p=pool[(fi+Math.floor(rnd()*3))%3];if(!p.length)p=pool.find(x=>x.length);if(!p)break;
        const it=p.pop();const k=it.oid+'|'+it.eid;
        (groups[k]=groups[k]||{d:day,fid:f.id,oid:it.oid,eid:it.eid,sizes:[]}).sizes.push(it.n);
      }
      Object.values(groups).forEach(g=>S.aps.push(g));
    });
  }
  const pf=(i,days,os,num,qtd,autor)=>{const o=S.os[os];const es=S.etapas.filter(e=>e.pid===o.pid);
    S.perdas.push({id:id(),d:addDays(t,days),oid:o.id,eid:es[i%es.length].id,fid:S.funcs[i%4].id,num,qtd,autor})};
  pf(0,-5,0,30,1,'Gênia');pf(1,-4,1,33,2,'Gênia');pf(2,-3,2,35,1,'Gênia');pf(4,-2,0,31,1,'Gênia');pf(3,-1,2,34,3,'Gênia');pf(1,0,0,29,1,'Gênia');
  S.dash=defaultDash(id);
  S.faltas.push({id:id(),d:addDays(t,-1),fid:S.funcs[3].id,motivo:'Faltou sem aviso',obs:'',autor:'Gênia'});
  S.avisos.push({id:id(),d:t,h:'08:00',texto:'Bom dia! Prioridade de hoje: OS KR001 (Escola Ballet Duarte).',urgente:true,de:'dir',autor:'Bruno',lido:false});
  return S;
}

function statsFunc(f,de,ate){

  const perd=S.perdas.filter(x=>x.fid===f.id&&x.d>=de&&x.d<=ate).reduce((s,x)=>s+x.qtd,0);

function osProgress(o){
  const es=S.etapas.filter(e=>e.pid===o.pid);const total=Object.values(o.grade).reduce((s,v)=>s+Number(v),0);

  return Math.min(100,done/(total*es.length)*100);
}

function niceMax(v){if(v<=0)return 4;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const c of[1,2,4,8,10]){if(v<=c*p)return c*p}return 10*p}
const short=n=>n>=1000?nf(n/1000,n%1000?1:0)+'k':nf(n,n<10&&n%1?1:0);
function bars(labels,series,{h=230,fmt=short,suffix=''}={}){
  const W=640,L=40,R=8,T=20,B=26,H=h;
  let maxv=niceMax(Math.max(1,...series.flatMap(s=>s.vals)));if(maxv<4&&series.every(s=>s.vals.every(Number.isInteger)))maxv=4;
  let g='';
  for(let i=0;i<=4;i++){const y=T+(H-T-B)*(1-i/4);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-7}" y="${y+4}" class="ax" text-anchor="end">${fmt(maxv/4*i)}${suffix}</text>`}
  const n=labels.length,bw=(W-L-R)/n,k=series.length,inner=bw*.7,sw=inner/k,every=Math.ceil(n/12),dense=n*k>14;
  labels.forEach((lb,i)=>{
    series.forEach((s,j)=>{const v=s.vals[i];const bh=(H-T-B)*v/maxv;const x=L+i*bw+(bw-inner)/2+j*sw;
      g+=`<rect x="${x.toFixed(1)}" y="${(H-B-bh).toFixed(1)}" width="${Math.max(1,sw-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${s.color}"><title>${esc(lb)}: ${nf(v,v%1?1:0)}${suffix}</title></rect>`;
      if(v>0){const tx=(x+Math.max(1,sw-2)/2).toFixed(1),ty=(H-B-bh-4).toFixed(1),txt=nf(v,v%1?1:0)+suffix;
        g+=dense?`<text x="${tx}" y="${ty}" class="vl" transform="rotate(-90 ${tx} ${ty})" text-anchor="start" dominant-baseline="middle" style="font-size:9px">${txt}</text>`:`<text x="${tx}" y="${ty}" class="vl" text-anchor="middle">${txt}</text>`}});
    if(i%every===0)g+=`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-8}" class="ax" text-anchor="middle">${esc(lb)}</text>`;
  });
  const lg=series.length>1||series[0].name?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras">${g}</svg>${lg}</div>`;
}

    const days=[];for(let d=de,i=0;d<=ate&&i<400;d=addDays(d,1),i++)days.push(d);

  const list=grpSum(rec.map(r=>[r,r.v]),kf);

}

function osFrac(oid,eid,de,ate){const o=osDe(oid);const total=Object.values(o.grade).reduce((s,v)=>s+Number(v),0);if(!total)return 0;

   rows:S.os.map(o=>[o.codigo,o.cliente,(prodDe(o.pid)||{}).nome||'-',o.cor,Object.values(o.grade).reduce((s,v)=>s+Number(v),0),S.perdas.filter(p=>p.oid===o.id).reduce((s,p)=>s+p.qtd,0),r1(osProgress(o)),o.status])})},

 faltas:{t:'Presença e faltas',per:true,build:(de,ate)=>({head:['Data','Funcionário','Setor','Motivo','Observação','Registrado por'],

const cellTxt=v=>typeof v==='number'?nf(v,Number.isInteger(v)?0:1):String(v==null?'':v);
const csvEsc=s=>/[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
async function exportRep(f){
  const dls=await getDl();if(!dls)return;
  const k=ui.relK||'desempenho',d=repData(k),base='ritmus-'+k+(REP[k].per?'-'+d.de+'_a_'+d.ate:'');
  let name,data;
  try{
    if(f==='csv'){name=base+'.csv';data=new Blob(['﻿'+[d.head,...d.rows].map(r=>r.map(c=>csvEsc(cellTxt(c))).join(';')).join('\r\n')],{type:'text/csv'})}
    else if(f==='xlsx'||f==='xlsxAll'){
      if(!window.XLSX){toast('Biblioteca do Excel não carregou. Recarregue a página.');return}
      const wb=XLSX.utils.book_new();
      const add=(dd,nm)=>{const ws=XLSX.utils.aoa_to_sheet([dd.head,...dd.rows]);ws['!cols']=dd.head.map((h,i)=>({wch:Math.min(40,Math.max(String(h).length,...dd.rows.map(r=>String(r[i]==null?'':r[i]).length))+2)}));XLSX.utils.book_append_sheet(wb,ws,nm.slice(0,31))};
      if(f==='xlsx'){add(d,d.title);name=base+'.xlsx'}else{Object.keys(REP).forEach(x=>add(repData(x),REP[x].t));name='ritmus-relatorios-'+d.de+'_a_'+d.ate+'.xlsx'}
      data=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'});
    }else{
      if(!(window.jspdf&&window.jspdf.jsPDF)){toast('Biblioteca do PDF não carregou. Recarregue a página.');return}
      const doc=new window.jspdf.jsPDF({orientation:d.head.length>6?'landscape':'portrait',unit:'mm',format:'a4'});
      try{doc.addImage(LOGO,'PNG',14,10,11,12.1)}catch(e){}
      doc.setFontSize(16);doc.setTextColor(30);doc.text('Ritmus Dance - '+d.title,29,16);doc.setFontSize(9);doc.setTextColor(120);doc.text(d.sub,29,22);
      doc.autoTable({startY:29,head:[d.head],body:d.rows.map(r=>r.map(cellTxt)),styles:{fontSize:8.5,cellPadding:2},headStyles:{fillColor:[199,67,117],textColor:255},alternateRowStyles:{fillColor:[247,243,245]},margin:{left:14,right:14,bottom:14}});
      const n=doc.getNumberOfPages(),w=doc.internal.pageSize.getWidth(),h=doc.internal.pageSize.getHeight();
      for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(140);doc.text('Página '+i+' de '+n,w-14,h-7,{align:'right'})}
      name=base+'.pdf';data=new Blob([doc.output('arraybuffer')],{type:'application/pdf'});
    }
    await dls.save({filename:name,data});toast('Arquivo pronto: '+name);
  }catch(e){
    if(e&&e.code==='declined')return;
    toast(e&&e.code==='rejected_extension'?'Formato não permitido nesta visualização.':'Não foi possível gerar o arquivo ('+((e&&(e.code||e.message))||'erro')+').');
  }
}

   <div><div class="sm muted" style="margin-bottom:8px">Grade final: quantidade por numeração (vazio = não tem)</div><div class="sizes">${SIZES.map(n=>`<label>${n}<input type="number" min="0" name="s${n}" aria-label="Quantidade do ${n}" value="${o&&o.grade[n]?o.grade[n]:''}"></label>`).join('')}</div></div>`,o?'Salvar alterações':'Criar OS',fd=>{
    const grade={};SIZES.forEach(n=>{const v=parseInt(fd.get('s'+n));if(v>0)grade[n]=v});

    const pid=o?o.pid:+fd.get('pid'),cor=String(fd.get('cor')).trim(),pedido=parseInt(fd.get('pedido'))||0,codigo=codeOs(pid,cor,pedido);
    if(S.os.some(x=>x.codigo===codigo&&(!o||x.id!==o.id))){toast('Já existe uma OS com o código '+codigo+'.');return false}
    const cliente=String(fd.get('cliente')).trim();
    if(o){
      Object.assign(o,{codigo,cliente,cor,pedido,grade});
      S.aps.forEach(a=>{if(a.oid===o.id)a.sizes=a.sizes.filter(n=>grade[n])});S.aps=S.aps.filter(a=>a.sizes.length);
      S.perdas=S.perdas.filter(p=>p.oid!==o.id||grade[p.num]);
      Object.keys(drafts).forEach(k=>{if(k.split('|')[1]==o.id)drafts[k]=drafts[k].filter(n=>grade[n])});
    }else S.os.push({id:uid(),codigo,cliente,cor,pedido,pid,grade,status:'Em andamento'});
    commit(o?'OS '+codigo+' atualizada.':'OS '+codigo+' criada.',true);
  },true);

}

function bulkSave(){
  const t=today();let n=0;
  Object.keys(drafts).forEach(k=>{
    const [fid,oid,eid]=k.split('|').map(Number);const sizes=drafts[k].slice().sort((a,b)=>a-b);
    const i=S.aps.findIndex(x=>x.d===t&&x.fid===fid&&x.oid===oid&&x.eid===eid);
    if(!sizes.length){if(i>=0)S.aps.splice(i,1)}
    else if(i>=0)S.aps[i].sizes=sizes;else S.aps.push({d:t,fid,oid,eid,sizes});
    n++;
  });
  drafts={};
  const ativos=S.funcs.filter(f=>f.ativo);
  const atual=funcDe(ui.gerF);
  let msg=n?'Grades de '+(atual?atual.nome:'')+' salvas.':'Nenhuma alteração para salvar.';
  if(ativos.length){const i=ativos.findIndex(f=>f.id===ui.gerF);const nx=ativos[(i+1)%ativos.length];ui.gerF=nx.id;msg+=' Agora: '+nx.nome+'.'}
  persist();draw();window.scrollTo(0,0);toast(msg);
}

async function lerPlanilha(file){
  if(!window.XLSX){toast('Biblioteca do Excel não carregou. Recarregue a página.');return}
  let rows;
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',blankrows:false})}
  catch(e){toast('Não consegui ler esse arquivo. Use o modelo em .xlsx ou .csv.');return}
  const hi=rows.findIndex(r=>r.some(c=>norm(c)==='produto'));
  if(hi<0){toast('Não achei a linha de títulos. Use a planilha modelo.');return}
  const H=rows[hi],col=n=>H.findIndex(c=>norm(c)===n),ci={p:col('produto'),c:col('cor'),n:H.findIndex(c=>norm(c).includes('pedido')),cl:col('cliente'),st:col('status'),os:col('os')};
  const szc=[];H.forEach((c,i)=>{const n=Number(c);if(c!==''&&Number.isInteger(n)&&n>=17&&n<=44)szc.push([n,i])});
  if(ci.c<0||ci.cl<0||!szc.length){toast('Faltam colunas (Cor, Cliente ou numerações). Use a planilha modelo.');return}
  let next=Math.max(0,...S.os.map(o=>+o.pedido||0))+1;const inFile=new Set();const out=[];
  rows.slice(hi+1).forEach((r,k)=>{

    const osCod=ci.os>=0?String(r[ci.os]).trim().toUpperCase():'';const exOs=osCod?S.os.find(o=>o.codigo.toUpperCase()===osCod):null;
    let ped=ci.n>=0?parseInt(r[ci.n]):NaN;if(!(ped>0))ped=exOs?exOs.pedido:next++;else next=Math.max(next,ped+1);
    const grade={};szc.forEach(([n,i])=>{const v=parseInt(r[i]);if(v>0)grade[n]=v});
    const stTxt=ci.st>=0?norm(r[ci.st]):'';const status=stTxt.startsWith('conclu')?'Concluída':stTxt?'Em andamento':null;
    let err='';
    if(!prod)err='Produto não cadastrado';else if(!cor)err='Cor vazia';else if(!cliente)err='Cliente vazio';else if(!Object.keys(grade).length)err='Sem quantidades';
    const codigo=prod?codeOs(prod.id,cor,ped):'-';
    if(!err&&osCod&&!exOs)err='OS '+osCod+' não encontrada (deixe vazio para criar nova)';

    if(!err&&inFile.has(codigo))err='Código '+codigo+' repetido na planilha';

  });

  pendingOs=out;
  const nNovo=out.filter(x=>!x.err&&x.acao==='novo').length,nUpd=out.filter(x=>!x.err&&x.acao==='atualizar').length,nIg=out.filter(x=>!x.err&&x.acao==='igual').length,nErr=out.filter(x=>x.err).length;
  const pill=x=>x.err?`<span class="pill bad">${esc(x.err)}</span>`:x.acao==='novo'?'<span class="pill ok">Nova</span>':x.acao==='atualizar'?`<span class="pill warn">Atualizar</span> <span class="sm muted">${esc(x.mud.join('; '))}</span>`:'<span class="pill">Sem mudanças</span>';

   ${nUpd?`<label class="row" style="gap:8px"><input type="checkbox" name="upd" checked style="width:auto"> Atualizar as ${nUpd} OS que já existem com os dados da planilha</label>`:''}
   <div class="tw"><table><thead><tr><th>Linha</th><th>OS</th><th>Cliente</th><th>Produto</th><th class="c">Peças</th><th>Situação</th></tr></thead><tbody>
   ${out.map(x=>`<tr><td class="num muted">${x.linha}</td><td><b>${esc(x.codigo)}</b></td><td>${esc(x.cliente)}</td><td>${esc(x.prod?x.prod.nome:x.produtoTxt)}</td><td class="c num">${ni(totG(x.grade))}</td><td>${pill(x)}</td></tr>`).join('')}</tbody></table></div>`,(nNovo+nUpd)?'Importar':'Fechar',fd=>{
    const doUpd=fd.get('upd')==='on';let n1=0,n2=0;
    pendingOs.forEach(x=>{

  },true);

const CFG=window.RITMUS_CONFIG||{};
let sb=null,chan=null,snap={},flushT=null,flushing=false,again=false,redrawPending=false,redrawT=null,subOnce=false;
const COLS=['funcs','produtos','etapas','os','perdas','avisos','faltas','aps','dash'];
const ALL=[...COLS,'cfg'];

const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);
const keyOf=(c,x)=>c==='aps'?[x.d,x.fid,x.oid,x.eid].join('|'):String(x.id);

function applyRow(c,id,d){
  const s=canon(d),sn=snap[c]||(snap[c]=new Map());
  if(sn.get(id)===s)return false;
  sn.set(id,s);
  if(c==='cfg'){Object.keys(S.cfg).forEach(k=>delete S.cfg[k]);Object.assign(S.cfg,d);return true}
  const i=S[c].findIndex(x=>keyOf(c,x)===id);
  if(i>=0){const o=S[c][i];Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,d)}else S[c].push(d);
  if(c==='dash')S.dash.sort(bySort);

}
function removeRow(c,id){
  const sn=snap[c];if(!sn||!sn.has(id))return false;
  sn.delete(id);if(c==='cfg')return true;
  const i=S[c].findIndex(x=>keyOf(c,x)===id);if(i>=0)S[c].splice(i,1);
  return true;
}
function reconcile(rows){
  const seen={};let ch=false;
  rows.forEach(r=>{if(r.colecao==='meta')return;(seen[r.colecao]=seen[r.colecao]||new Set()).add(r.id);if(ALL.includes(r.colecao)&&applyRow(r.colecao,r.id,r.dados))ch=true});
  ALL.forEach(c=>{const sn=snap[c];if(!sn)return;[...sn.keys()].forEach(k=>{if(!(seen[c]&&seen[c].has(k))&&removeRow(c,k))ch=true})});
  return ch;
}
async function fetchRows(){
  const rows=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from('registros').select('colecao,id,dados').order('colecao').order('id').range(from,from+999);
    if(error)throw error;rows.push(...data);if(data.length<1000)break;
  }

}

/* gravação: compara com o último estado salvo e envia só o que mudou */
function persist(){clearTimeout(flushT);flushT=setTimeout(flush,350)}
async function flush(){
  if(!sb||!session)return;
  if(flushing){again=true;return}
  flushing=true;
  try{
    S.dash.forEach((w,i)=>{w.pos=i});
    const up=[],del=[];
    for(const c of ALL){
      const cur=new Map(rowsOf(c)),old=snap[c]||new Map();
      cur.forEach((o,k)=>{const s=canon(o);if(old.get(k)!==s)up.push({colecao:c,id:k,dados:o,s})});
      old.forEach((_,k)=>{if(!cur.has(k))del.push([c,k])});
    }
    for(let i=0;i<up.length;i+=400){
      const ch=up.slice(i,i+400);
      const {error}=await sb.from('registros').upsert(ch.map(({colecao,id,dados})=>({colecao,id,dados})),{onConflict:'colecao,id'});
      if(error)throw error;
      ch.forEach(r=>{(snap[r.colecao]=snap[r.colecao]||new Map()).set(r.id,r.s)});
    }
    const byC={};del.forEach(([c,k])=>(byC[c]=byC[c]||[]).push(k));
    for(const c in byC)for(let i=0;i<byC[c].length;i+=200){
      const ids=byC[c].slice(i,i+200);
      const {error}=await sb.from('registros').delete().eq('colecao',c).in('id',ids);
      if(error)throw error;
      ids.forEach(k=>snap[c].delete(k));
    }
  }catch(e){
    console.error(e);toast('Não consegui salvar agora. Confira a internet; vou tentar de novo.');setTimeout(persist,5000);
  }
  flushing=false;
  if(again){again=false;persist()}
}

  }catch(e){console.error(e);msgScreen('Não consegui conectar','Confira o endereço e a chave no config.js e a internet, depois recarregue.')}
})();

</script>
